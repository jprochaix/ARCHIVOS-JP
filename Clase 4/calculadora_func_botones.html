<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora con botones</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <h1>Calculadora con botones</h1>

  <form id="formulario">
    <label>Número 1:
      <input type="number" id="numero1" step="any">
    </label>
    <br><br>

    <label>Número 2:
      <input type="number" id="numero2" step="any">
    </label>
    <br><br>

    <div class="botones">
      <button type="button" id="btnSumar" title="Sumar">+</button>
      <button type="button" id="btnRestar" title="Restar">-</button>
      <button type="button" id="btnMultiplicar" title="Multiplicar">*</button>
      <button type="button" id="btnDividir" title="Dividir">/</button>
    </div>
  </form>

  <h2 id="resultado"></h2>

  <script src="calculadora_func_botones.js"></script>
</body>
</html>
